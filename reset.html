<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>更新拍拍学</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1ede4;
      color: #141414;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 15px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <p id="msg">正在清理拍拍学的旧缓存…</p>
  <script>
    // 只处理 /words/ 这一个站点的 Service Worker 和 words-* 缓存，
    // 不动本域名下其他项目的 localStorage 与缓存。
    (async () => {
      const msg = document.getElementById('msg');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            if (reg.scope.indexOf('/words/') !== -1) await reg.unregister();
          }
        }
        if (window.caches) {
          const keys = await caches.keys();
          for (const key of keys) {
            if (key.indexOf('words-') === 0) await caches.delete(key);
          }
        }
        msg.textContent = '已更新，正在打开…';
      } catch (e) {
        msg.textContent = '清理失败，请再打开一次本页';
      }
      setTimeout(() => location.replace('./?fresh=' + Date.now()), 600);
    })();
  </script>
</body>
</html>
